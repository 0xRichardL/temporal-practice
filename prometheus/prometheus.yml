global:
  scrape_interval: 10s
scrape_configs:
  - job_name: "temporalmetrics"
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Temporal Service metrics
      - targets:
          - "temporal-frontend:7299"
          - "temporal-history:7299"
          - "temporal-matching:7299"
          - "temporal-worker:7299"
        labels:
          group: "server-metrics"
