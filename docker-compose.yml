x-temporal-server-common: &temporal-server-common
  image: temporalio/server:1.29.6
  environment:
    DB: "postgres12"
    DB_PORT: "5432"
    POSTGRES_USER: "postgres"
    POSTGRES_PWD: "postgres"
    POSTGRES_SEEDS: "postgres"
    BIND_ON_IP: 0.0.0.0
    DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/sql.yaml
    PROMETHEUS_ENDPOINT: 0.0.0.0:7299
  networks:
    - internal
  volumes:
    - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig
  depends_on:
    temporal-admin-tools:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

services:
  # Postgres: PostgreSQL database used by services and Temporal for persistence
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    networks:
      - internal
    volumes:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Temporal Admin Tools: setup and admin CLI (tctl) for Temporal management
  temporal-admin-tools:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    container_name: temporal-admin-tools
    restart: "on-failure:6"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: postgres
    networks:
      - internal
    volumes:
      - ./temporal-admin-tools:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    depends_on:
      postgres:
        condition: service_healthy

  # Temporal Frontend: public gRPC/API endpoint for clients, UI, and admin tools
  temporal-frontend:
    <<: *temporal-server-common
    container_name: temporal-frontend
    command: ["start", "--service", "frontend"]
    ports:
      - "7233:7233"
      - "7299:7299"
    depends_on:
      temporal-history:
        condition: service_started
      temporal-matching:
        condition: service_started
      temporal-worker:
        condition: service_started
      temporal-admin-tools:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # Temporal History: workflow state machine and persistence coordination
  temporal-history:
    <<: *temporal-server-common
    container_name: temporal-history
    command: ["start", "--service", "history"]

  # Temporal Matching: task queue matching and dispatch
  temporal-matching:
    <<: *temporal-server-common
    container_name: temporal-matching
    command: ["start", "--service", "matching"]

  # Temporal Worker: internal system workflow worker
  temporal-worker:
    <<: *temporal-server-common
    container_name: temporal-worker
    command: ["start", "--service", "worker"]

  # Temporal Create Namespace: one-shot task to create the default Temporal namespace
  temporal-create-namespace:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    container_name: temporal-create-namespace
    restart: "on-failure:5"
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      DEFAULT_NAMESPACE: default
    networks:
      - internal
    volumes:
      - ./temporal-create-namespace:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Temporal UI: web-based UI for managing and inspecting Temporal workflows
  temporal-ui:
    image: temporalio/ui:2.50.0
    container_name: temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Prometheus: metrics scraper and time-series database for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana: dashboards and visualizations for Prometheus metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - internal
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/

  # Account service: handles account creation, updates, and related workflows
  account:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: account
    container_name: account
    restart: "on-failure:6"
    environment:
      DB_URI: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8001:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Fraud service: performs fraud detection checks and workflow orchestration
  fraud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: fraud
    container_name: fraud
    restart: "on-failure:6"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8002:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Notification service: sends SMS/email notifications and triggers workflows
  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    container_name: notification
    restart: "on-failure:6"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8003:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Payment service: processes payments and coordinates payment workflows
  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    container_name: payment
    restart: "on-failure:6"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8004:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  internal:
    driver: bridge
