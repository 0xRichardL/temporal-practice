x-temporal-server-common: &temporal-server-common
  image: temporalio/server:1.29.6
  env_file:
    - ./temporal-server.docker.env
  networks:
    - internal
  volumes:
    - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig

services:
  # Postgres: PostgreSQL database used by services and Temporal for persistence
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    cpus: 4
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Temporal Admin Tools: setup and admin CLI (tctl) for Temporal management
  temporal-admin-tools:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    container_name: temporal-admin-tools
    restart: "on-failure:1"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      SQL_PASSWORD: postgres
    networks:
      - internal
    volumes:
      - ./temporal-admin-tools:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Monitoring Init: create Alloy's least-privilege role and query extension
  postgres-monitoring-init:
    image: postgres:16
    container_name: postgres-monitoring-init
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      PGPASSWORD: postgres
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-alloy_monitor}
    networks:
      - internal
    volumes:
      - ./postgres/setup-monitoring.sh:/scripts/setup-monitoring.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-monitoring.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal-admin-tools:
        condition: service_completed_successfully

  # Temporal Matching: task queue matching and dispatch
  temporal-matching:
    <<: *temporal-server-common
    container_name: temporal-matching
    restart: "on-failure:1"
    environment:
      TEMPORAL_SERVICES: matching
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully

  # Temporal History: workflow state machine and persistence coordination
  temporal-history:
    <<: *temporal-server-common
    container_name: temporal-history
    restart: "on-failure:1"
    environment:
      TEMPORAL_SERVICES: history
    depends_on:
      temporal-matching:
        condition: service_started

  # Temporal Frontend: public gRPC/API endpoint for clients, UI, and admin tools
  temporal-frontend:
    <<: *temporal-server-common
    container_name: temporal-frontend
    restart: "on-failure:1"
    environment:
      TEMPORAL_SERVICES: frontend
    ports:
      - "7233:7233"
      - "7299:7299"
    depends_on:
      temporal-history:
        condition: service_started
      temporal-matching:
        condition: service_started
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # Temporal Worker: internal system workflow worker
  temporal-worker:
    <<: *temporal-server-common
    container_name: temporal-worker
    restart: "on-failure:1"
    environment:
      TEMPORAL_SERVICES: worker
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Temporal Create Namespace: one-shot task to create the default Temporal namespace
  temporal-create-namespace:
    image: temporalio/admin-tools:1.29.6.1-tctl-1.18.4-cli-1.7.0
    container_name: temporal-create-namespace
    restart: "on-failure:1"
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      DEFAULT_NAMESPACE: default
    networks:
      - internal
    volumes:
      - ./temporal-create-namespace:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Temporal UI: web-based UI for managing and inspecting Temporal workflows
  temporal-ui:
    image: temporalio/ui:2.50.0
    container_name: temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Prometheus: metrics scraper and time-series database for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"

  # Alloy: collect PostgreSQL metrics and remote-write them to Prometheus
  alloy:
    image: grafana/alloy:v1.17.0
    container_name: alloy
    restart: unless-stopped
    environment:
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-alloy_monitor}
    ports:
      - "12345:12345"
    networks:
      - internal
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy
    depends_on:
      postgres-monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana: dashboards and visualizations for Prometheus metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - internal
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/

  # Account service: handles account creation, updates, and related workflows
  account:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: account
    container_name: account
    restart: "on-failure:1"
    environment:
      DB_URI: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8001:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Fraud service: performs fraud detection checks and workflow orchestration
  fraud:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: fraud
    container_name: fraud
    restart: "on-failure:1"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8002:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Notification service: sends SMS/email notifications and triggers workflows
  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    container_name: notification
    restart: "on-failure:1"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8003:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

  # Payment service: processes payments and coordinates payment workflows
  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    container_name: payment
    restart: "on-failure:1"
    environment:
      TEMPORAL_HOST: temporal-frontend:7233
    ports:
      - "8004:8080"
    networks:
      - internal
    depends_on:
      temporal-frontend:
        condition: service_healthy

volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
  alloy_data: {}

networks:
  internal:
    driver: bridge
