# PostgreSQL 16 production baseline for this project's Docker Compose service.
#
# Sizing target:
#   - 4 CPU cores
#   - 4 GB container memory limit
#   - Temporal plus application services sharing the same database server
#
# Revisit the memory/WAL/checkpoint values when the container limits, workload,
# storage class, or use of an external connection pooler changes.


#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
port = 5432

# Temporal can open several pools because this project runs frontend, history,
# matching, and worker as separate services. Keep this high enough to avoid
# startup storms, but low enough that memory stays bounded.
max_connections = 300

# Keep a small reserve for superuser/admin access during connection pressure.
superuser_reserved_connections = 5

# Require password encryption compatible with modern clients.
password_encryption = scram-sha-256


#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

# Roughly 25% of a 4 GB container. Do not set this above the real container or
# host memory budget.
shared_buffers = 1GB

# Planner hint for OS page cache plus shared buffers. For a dedicated 4 GB
# container, 3 GB is a practical starting point.
effective_cache_size = 3GB

# Per-operation memory. This is multiplied by concurrent sorts/hash operations,
# so keep it moderate with max_connections at 300.
work_mem = 8MB

# Used by VACUUM, CREATE INDEX, ALTER TABLE, and similar maintenance work.
maintenance_work_mem = 256MB
autovacuum_work_mem = 128MB


#------------------------------------------------------------------------------
# WRITE-AHEAD LOG, CHECKPOINTS, AND DURABILITY
#------------------------------------------------------------------------------

# Production durability: do not disable these unless you can accept data loss.
fsync = on
synchronous_commit = on
full_page_writes = on

wal_level = replica
wal_compression = on

# Smooth checkpoints and reduce write spikes. Tune upward for heavy write loads
# if storage and recovery-time objectives allow it.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Keep enough WAL senders/slots for backups or read replicas without making this
# node look like a large replication hub.
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 512MB


#------------------------------------------------------------------------------
# QUERY PLANNER AND PARALLELISM
#------------------------------------------------------------------------------

# Values are reasonable for SSD-backed storage. Increase random_page_cost for
# slower network disks; decrease only after measuring.
random_page_cost = 1.1
effective_io_concurrency = 200

max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2


#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s

# More aggressive than defaults to keep bloat under control in workflow/state
# tables that update frequently.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50


#------------------------------------------------------------------------------
# TIMEOUTS AND RESOURCE GUARDS
#------------------------------------------------------------------------------

# Prevent abandoned transactions from holding locks and blocking vacuum.
idle_in_transaction_session_timeout = 60s

# Avoid infinite lock waits. Application-level retries should handle this.
lock_timeout = 10s

# Leave statement_timeout disabled globally because Temporal schema migrations
# and long-running maintenance can be legitimate. Prefer role/database-specific
# statement timeouts for application users.
statement_timeout = 0

# Do not globally kill idle pooled connections. Use a pooler/application setting
# when you need aggressive connection recycling.
idle_session_timeout = 0


#------------------------------------------------------------------------------
# LOGGING AND OBSERVABILITY
#------------------------------------------------------------------------------

logging_collector = off
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error

# Useful production diagnostics without logging every statement.
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 5s
log_min_duration_statement = 500ms

log_line_prefix = '%m [%p] %q%u@%d app=%a client=%h '

# pg_stat_statements must also be created in each database:
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

track_io_timing = on
track_activity_query_size = 4096


#------------------------------------------------------------------------------
# CLIENT DEFAULTS
#------------------------------------------------------------------------------

timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'


#------------------------------------------------------------------------------
# SSL
#------------------------------------------------------------------------------

# Enable TLS in real production with mounted certificates and matching pg_hba.conf
# rules. Leaving it off here keeps the Docker Compose dev bootstrap simple.
ssl = off
